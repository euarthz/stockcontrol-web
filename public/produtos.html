<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockControl – Produtos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ======= SIDEBAR ======= -->
<aside class="sidebar" id="sidebar">
  <a class="sidebar-brand" href="index.html">
    <div class="sidebar-brand-icon"><i class="bi bi-box-seam-fill"></i></div>
    <div class="sidebar-brand-text">
      <span class="sidebar-brand-name">StockControl</span>
      <span class="sidebar-brand-sub">Web System</span>
    </div>
  </a>
  <div class="sidebar-section">Menu</div>
  <nav>
    <a class="nav-item" href="index.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    <a class="nav-item active" href="produtos.html"><i class="bi bi-box2-fill"></i><span>Produtos</span></a>
    <a class="nav-item" href="notas.html"><i class="bi bi-receipt-cutoff"></i><span>Notas Fiscais</span></a>
    <a class="nav-item" href="movimentacoes.html"><i class="bi bi-arrow-left-right"></i><span>Movimentações</span></a>
  </nav>
  <div class="sidebar-footer">StockControl v1.0 &copy; 2025</div>
</aside>

<!-- ======= MAIN ======= -->
<div class="main-content">

  <header class="topbar">
    <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
    <span class="topbar-title"><i class="bi bi-box2-fill me-2 text-primary"></i>Produtos</span>
    <div class="topbar-right">
      <span class="topbar-date" id="topbarDate"></span>
    </div>
  </header>

  <main class="page-content">

    <!-- Page Header -->
    <div class="page-header fade-in">
      <div class="page-header-left">
        <h2>Gerenciar Produtos</h2>
        <p id="countProdutos" class="text-muted">Carregando…</p>
      </div>
      <button class="btn btn-primary" onclick="abrirNovo()">
        <i class="bi bi-plus-lg"></i>Novo Produto
      </button>
    </div>

    <!-- Filtros -->
    <div class="card-panel mb-3 fade-in-d1">
      <div class="card-panel-body" style="padding:16px 24px">
        <div class="row g-2">
          <div class="col-md-6">
            <div class="search-wrapper">
              <i class="bi bi-search search-icon"></i>
              <input type="text" class="form-control" id="buscaInput"
                placeholder="Buscar por nome ou código…">
            </div>
          </div>
          <div class="col-md-3">
            <select class="form-select" id="filtroCategoria">
              <option value="">Todas as categorias</option>
            </select>
          </div>
          <div class="col-md-3">
            <button class="btn btn-outline-secondary w-100" onclick="loadProdutos()">
              <i class="bi bi-arrow-clockwise me-1"></i>Atualizar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabela -->
    <div class="card-panel fade-in-d2">
      <div class="card-panel-body">
        <table class="table" id="tblProdutos">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Qtd / Mínimo</th>
              <th>Status</th>
              <th style="width:90px">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="7" class="text-center py-4 text-muted">
              <div class="spinner-border spinner-border-sm me-2"></div>Carregando…
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- ======= MODAL: PRODUTO ======= -->
<div class="modal fade" id="modalProduto" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitulo">Novo Produto</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="frmProduto" onsubmit="return false">
          <div class="row g-3">

            <div class="col-md-4">
              <label class="form-label">Código</label>
              <input type="text" class="form-control" id="campoCodigo" placeholder="Ex: PROD001">
            </div>
            <div class="col-md-8">
              <label class="form-label">Nome do Produto *</label>
              <input type="text" class="form-control" id="campoNome"
                placeholder="Nome completo do produto" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Categoria</label>
              <input type="text" class="form-control" id="campoCategoria"
                placeholder="Ex: Alimentos, Limpeza, Higiene…" list="listaCategorias">
              <datalist id="listaCategorias"></datalist>
            </div>
            <div class="col-md-6">
              <label class="form-label">Preço de Custo (R$)</label>
              <div class="input-group">
                <span class="input-group-text">R$</span>
                <input type="number" class="form-control" id="campoPreco"
                  step="0.01" min="0" placeholder="0,00">
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label">Quantidade Inicial</label>
              <div class="input-group">
                <input type="number" class="form-control" id="campoQtd" min="0" value="0">
                <span class="input-group-text">un.</span>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label">
                Quantidade Mínima
                <span class="text-muted" style="font-weight:400">(alerta de estoque baixo)</span>
              </label>
              <div class="input-group">
                <input type="number" class="form-control" id="campoQtdMin" min="0" value="5">
                <span class="input-group-text">un.</span>
              </div>
            </div>

          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvarProd" onclick="salvarProduto()">
          <i class="bi bi-check-lg me-1"></i>Salvar Produto
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/produtos.js"></script>
<script>
  // Preencher datalist de categorias
  async function loadCatDatalist() {
    try {
      const cats = await apiRequest('/categorias');
      const dl   = document.getElementById('listaCategorias');
      if (dl) dl.innerHTML = cats.map(c => `<option value="${c}">`).join('');
    } catch(_) {}
  }
  document.addEventListener('DOMContentLoaded', loadCatDatalist);
</script>
</body>
</html>
